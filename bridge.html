<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>번역 설정</title>
<style>
:root{--bg:#fbfaf7;--fg:#222;--mut:#777;--card:#fff;--bd:#ddd;--ac:#2f6fdb;--ok:#2e8b57;--er:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ddd;--mut:#999;--card:#212328;--bd:#3a3c42;--ac:#6ea0ff;--ok:#5cc28a;--er:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Noto Sans KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:22px 18px 60px}
h1{font-size:21px;margin:0 0 6px}
.s{color:var(--mut);font-size:14px;margin:0 0 14px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
#sa{min-height:110px;font:12px/1.4 ui-monospace,monospace}
.h{font-size:13px;color:var(--mut);margin-top:5px}
button{width:100%;padding:14px;margin-top:14px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--ac);color:#fff}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
#state{font-size:14px;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card)}
#msg{font-size:14px;min-height:20px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<main id="ui" hidden>
<h1>번역 설정</h1>
<p class="s">여기 넣은 내용은 이 설정 페이지의 저장공간에만 보관돼요. 소설 사이트와 그 사이트의 스크립트는 읽을 수 없어요.</p>
<div id="state"></div>
<label for="sa">서비스 계정 JSON</label>
<textarea id="sa" autocomplete="off" spellcheck="false"></textarea>
<div class="h" id="saHint">콜로모에 넣던 JSON 텍스트를 그대로 붙여넣으세요.</div>
<label for="m">모델 이름</label>
<input id="m" value="gemini-3.8-flash" autocomplete="off">
<label for="loc">리전</label>
<input id="loc" value="global" autocomplete="off">
<div class="h">보통 global 그대로 두면 돼요. 모델을 못 찾으면 다른 리전을 자동으로 시도해요.</div>
<input id="fs" type="hidden" value="18">
<label for="g">용어집 (선택)</label>
<textarea id="g" placeholder="林凡=임범&#10;天元宗=천원종"></textarea>
<div class="h">한 줄에 하나씩. 인물 이름이 화마다 달라지는 걸 막아줘요.</div>
<button id="save" type="button">저장하고 번역 시작</button>
<button id="close" class="sec" type="button">닫기</button>
<button id="del" class="sec" type="button">저장된 키 삭제</button>
<div id="msg"></div>
</main>
<script>
(function () {
  var KEY = 'nvtrCfg', TOK = 'nvtrTok';
  var $ = function (id) { return document.getElementById(id); };
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  var C = load();
  // 종료된 2.x 모델이 저장돼 있으면 자동 교체
  if (C.m && /^gemini-[12]\./.test(C.m)) { C.m = 'gemini-3.8-flash'; try { localStorage.setItem(KEY, JSON.stringify(C)); } catch (e) { } }
  var P = window.parent;
  function send(m) { m.nvtr = 1; P.postMessage(m, '*'); } // 번역 결과만 보냄. 키는 절대 보내지 않음.
  function getPrefs() { try { return JSON.parse(localStorage.getItem('nvtrPrefs') || 'null'); } catch (e) { return null; } }
  function configured() { return !!(C.sa && C.sa.private_key); }

  // ---------- 설정 화면 ----------
  function showUI() {
    $('ui').hidden = false;
    $('m').value = C.m || 'gemini-3.8-flash';
    $('loc').value = C.loc || 'global';
    $('fs').value = C.fs || 18;
    $('g').value = C.g || '';
    $('sa').value = '';
    if (configured()) {
      $('state').textContent = '✓ 키 저장됨: ' + C.sa.client_email;
      $('state').style.color = 'var(--ok)';
      $('sa').placeholder = '키를 바꿀 때만 새 JSON을 붙여넣으세요';
      $('close').hidden = false; $('del').hidden = false;
      $('save').textContent = '저장';
    } else {
      $('state').textContent = '처음 한 번만 설정하면 돼요';
      $('state').style.color = '';
      $('sa').placeholder = '{"type":"service_account","project_id":…}';
      $('close').hidden = true; $('del').hidden = true;
      $('save').textContent = '저장하고 번역 시작';
    }
    $('msg').textContent = '';
  }
  $('save').onclick = function () {
    var n = {
      sa: C.sa, m: $('m').value.trim() || 'gemini-3.8-flash', loc: $('loc').value.trim() || 'global',
      fs: parseInt($('fs').value, 10) || 18, g: $('g').value.trim()
    };
    var raw = $('sa').value.trim();
    if (raw) {
      var j;
      try { j = JSON.parse(raw); } catch (e) { return err('JSON 형식이 올바르지 않아요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인하세요.'); }
      if (!j.private_key || !j.client_email || !j.project_id) return err('JSON에 private_key, client_email, project_id가 있어야 해요.');
      n.sa = { project_id: j.project_id, client_email: j.client_email, private_key: j.private_key };
      try { localStorage.removeItem(TOK); } catch (e) { }
    }
    if (!n.sa) return err('서비스 계정 JSON을 붙여넣어 주세요.');
    try { localStorage.setItem(KEY, JSON.stringify(n)); } catch (e) { return err('저장 실패: ' + e.message); }
    C = n; $('sa').value = '';
    $('ui').hidden = true;
    send({ type: 'ready', prefs: getPrefs() });
  };
  $('close').onclick = function () { $('ui').hidden = true; send({ type: 'closeSettings' }); };
  $('del').onclick = function () {
    try { localStorage.removeItem(KEY); localStorage.removeItem(TOK); } catch (e) { }
    C = {}; showUI(); $('msg').textContent = '삭제했어요.'; $('msg').style.color = 'var(--ok)';
  };
  function err(t) { $('msg').textContent = t; $('msg').style.color = 'var(--er)'; }

  // ---------- 인증 ----------
  function b64u(s) { return btoa(s).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_'); }
  async function token(force) {
    if (!force) {
      try { var t = JSON.parse(localStorage.getItem(TOK) || 'null'); if (t && t.e === C.sa.client_email && t.x > Date.now() + 60000) return t.v; } catch (e) { }
    }
    var now = Math.floor(Date.now() / 1000);
    var hc = b64u(JSON.stringify({ alg: 'RS256', typ: 'JWT' })) + '.' + b64u(JSON.stringify({
      iss: C.sa.client_email, scope: 'https://www.googleapis.com/auth/cloud-platform',
      aud: 'https://oauth2.googleapis.com/token', iat: now, exp: now + 3600 }));
    var pem = C.sa.private_key.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
    var der = Uint8Array.from(atob(pem), function (c) { return c.charCodeAt(0); });
    var key = await crypto.subtle.importKey('pkcs8', der, { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']);
    var sig = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(hc)));
    var bin = ''; for (var i = 0; i < sig.length; i++) bin += String.fromCharCode(sig[i]);
    var r = await fetch('https://oauth2.googleapis.com/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=' + hc + '.' + b64u(bin) });
    var j = await r.json();
    if (!j.access_token) throw new Error('토큰 발급 실패: ' + (j.error_description || j.error || r.status));
    try { localStorage.setItem(TOK, JSON.stringify({ v: j.access_token, x: Date.now() + (j.expires_in || 3600) * 1000, e: C.sa.client_email })); } catch (e) { }
    return j.access_token;
  }

  // ---------- 번역 ----------
  function sys() {
    return '너는 중국어 웹소설 전문 번역가다. 입력은 중국어(번체 또는 간체) 소설 한 화의 본문이며 한 줄이 한 문단이다. ' +
      '자연스럽고 읽기 좋은 한국어 소설 문체로 번역하라.\n규칙:\n' +
      '1) 번역문만 출력한다. 원문, 설명, 주석, 머리말을 붙이지 않는다.\n' +
      '2) 문단 구분을 유지해 한 문단을 한 줄로 출력한다.\n' +
      '3) 인명·지명·무공명 등 고유명사는 한자 독음으로 일관되게 옮긴다.\n' +
      '4) 사이트 광고, 홍보, 안내 문구로 보이는 줄은 출력하지 않는다.\n' +
      '5) 입력이 "[제목]"으로 시작하는 줄이 있으면 그 줄은 "[제목] 번역된 제목" 형식으로 출력한다.' +
      (C.g ? '\n\n다음 용어집을 반드시 따른다:\n' + C.g : '');
  }
  function urlFor(loc) {
    var host = loc === 'global' ? 'aiplatform.googleapis.com'
      : /^(us|eu)$/.test(loc) ? 'aiplatform.' + loc + '.rep.googleapis.com'
      : loc + '-aiplatform.googleapis.com';
    return 'https://' + host + '/v1/projects/' + encodeURIComponent(C.sa.project_id) + '/locations/' + encodeURIComponent(loc) +
      '/publishers/google/models/' + encodeURIComponent(C.m) + ':generateContent';
  }
  async function translate(text, temp) {
    if (!configured()) throw new Error('설정이 안 되어 있어요. ⚙ 설정을 눌러주세요.');
    var req = {
      systemInstruction: { parts: [{ text: sys() }] },
      contents: [{ role: 'user', parts: [{ text: text }] }],
      generationConfig: { temperature: typeof temp === 'number' ? temp : 0.3, maxOutputTokens: 30000 },
      safetySettings: ['HARM_CATEGORY_HARASSMENT', 'HARM_CATEGORY_HATE_SPEECH',
        'HARM_CATEGORY_SEXUALLY_EXPLICIT', 'HARM_CATEGORY_DANGEROUS_CONTENT']
        .map(function (c) { return { category: c, threshold: 'BLOCK_ONLY_HIGH' }; })
    };
    if (C.noThink !== 1) req.generationConfig.thinkingConfig = { thinkingLevel: 'low' };
    var locs = [C.loc || 'global', 'global', 'us', 'us-central1'].filter(function (v, i, a) { return a.indexOf(v) === i; }), li = 0;
    var last;
    for (var t = 0; t < 3; t++) {
      try {
        var tk = await token(t > 0 && last && /API 401/.test(last.message));
        var ac = new AbortController(), to = setTimeout(function () { ac.abort(); }, 180000);
        var r, j;
        try {
          r = await fetch(urlFor(locs[li]), { method: 'POST', signal: ac.signal, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tk }, body: JSON.stringify(req) });
          j = await r.json();
        } catch (x) { throw new Error(x.name === 'AbortError' ? '응답이 3분 넘게 없어요 (시간 초과)' : x.message); }
        finally { clearTimeout(to); }
        if (r.status === 400 && req.generationConfig.thinkingConfig && /think/i.test(JSON.stringify(j))) {
          delete req.generationConfig.thinkingConfig; C.noThink = 1; try { localStorage.setItem(KEY, JSON.stringify(C)); } catch (e) { } t--; continue;
        }
        if (r.status === 404 && li < locs.length - 1) { li++; t--; continue; } // 다른 리전으로 재시도
        if (r.ok && locs[li] !== C.loc) { C.loc = locs[li]; try { localStorage.setItem(KEY, JSON.stringify(C)); } catch (e) { } }
        if (!r.ok) throw new Error('API ' + r.status + ': ' + ((j.error && j.error.message) || JSON.stringify(j)).slice(0, 300));
        var cand = j.candidates && j.candidates[0];
        var out = cand && cand.content && cand.content.parts
          ? cand.content.parts.filter(function (p) { return !p.thought; }).map(function (p) { return p.text || ''; }).join('') : '';
        if (cand && cand.finishReason === 'MAX_TOKENS') throw new Error('MAX_TOKENS: 출력이 잘림');
        if (!out) throw new Error('번역 결과 없음 (' + ((cand && cand.finishReason) || (j.promptFeedback && j.promptFeedback.blockReason) || '알 수 없음') + ')');
        return out;
      } catch (e) {
        last = e;
        if (/MAX_TOKENS|번역 결과 없음/.test(e.message)) break;
        if (/API (429|500|502|503|504)/.test(e.message) && t < 2) { await new Promise(function (ok) { setTimeout(ok, 5000 * (t + 1)); }); continue; }
        if (/API 4(00|03|04)|토큰 발급|시간 초과/.test(e.message) || (/API 401/.test(e.message) && t > 0)) break;
        await new Promise(function (ok) { setTimeout(ok, 1500 * (t + 1)); });
      }
    }
    throw last;
  }

  // ---------- 소설 페이지와 통신 ----------
  window.addEventListener('message', async function (e) {
    if (e.source !== P || !e.data || !e.data.nvtr) return;
    var d = e.data;
    if (d.type === 'translate') {
      try { send({ type: 'result', id: d.id, out: await translate(String(d.text || ''), d.temp) }); }
      catch (x) { send({ type: 'result', id: d.id, error: x.message }); }
    } else if (d.type === 'setPrefs') {
      var cur = getPrefs();
      if (d.prefs && (!cur || (d.prefs.ts || 0) >= (cur.ts || 0))) { try { localStorage.setItem('nvtrPrefs', JSON.stringify(d.prefs)); } catch (x) { } }
    } else if (d.type === 'settings') {
      showUI();
    }
  });

  if (P === window) { // 직접 열었을 때: 여기서 저장해도 소설 사이트에서는 안 보이므로 안내만
    document.body.innerHTML = '<main><h1>소설 번역 설정 페이지</h1><p class="s">이 페이지는 직접 여는 곳이 아니에요. 소설 페이지에서 북마크를 실행하면 설정 화면이 자동으로 떠요.</p></main>';
    return;
  }
  if (configured()) send({ type: 'ready', prefs: getPrefs() });
  else { showUI(); send({ type: 'needSetup' }); }
})();
</script>
</body>
</html>
